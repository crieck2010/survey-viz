# Built-in named-region gazetteer for survey-viz.
#
# Each entry:
#   key      - stable slug used as VizSpec.region_key
#   name     - display name
#   aliases  - extra phrases the parser matches (case-insensitive, longest match wins)
#   bbox     - [lon_min, lat_min, lon_max, lat_max] in decimal degrees (WGS84)
#   notes    - data-availability note (honest: the 5 Great Lakes are fetchable via
#              GLSEA; SST anywhere else is fetchable via OISST/MUR since
#              survey-currents v0.3.0; other variables still raise a clear
#              "no adapter yet" error)
#
# Bboxes are intentionally generous (framing, not bathymetry).

regions:
  # ---- Great Lakes (fetchable today) ----
  - key: lake-superior
    name: Lake Superior
    aliases: [superior, gitche gumee]
    bbox: [-92.5, 46.0, -84.5, 48.8]
    notes: Fetchable today via the GLSEA adapter in survey-currents (v0.2.0+).
  - key: lake-michigan
    name: Lake Michigan
    aliases: [michigan]
    bbox: [-88.2, 41.5, -85.8, 46.2]
