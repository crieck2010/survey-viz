[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "survey-viz"
version = "0.26.1"
description = "Plain-English descriptions to vertical map frame sequences: deterministic parser, spec, and offline renderer."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Charles Rieck" }]
keywords = ["visualization", "maps", "social-media", "reels", "geospatial"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["pyyaml"]

[project.optional-dependencies]
render = ["numpy", "matplotlib"]
test = ["pytest"]
# Smart default time windows via the survey-timescales peer engine
# (optional; the parser keeps its documented past-1-year default when
# the peer is absent — graceful degradation, never a hard dependency).
timescales = ["survey-timescales>=0.1.0"]
# mapped.earth aesthetic presets via the survey-aesthetics peer engine,
# plus place labels via the survey-gazetteer peer engine (optional;
# render_viz(preset=...) raises an honest RuntimeError with the install
# command when a requested peer is absent — the legacy renderer never
# touches either). Both pinned to their GitHub releases (not on PyPI).
aesthetics = [
  "survey-aesthetics @ git+https://github.com/crieck2010/survey-aesthetics@v0.3.0",
  "survey-gazetteer @ git+https://github.com/crieck2010/survey-gazetteer@v0.1.0",
  "survey-flow @ git+https://github.com/crieck2010/survey-flow@v0.1.0",
]

[project.scripts]
viz = "viz.cli:main"

[project.urls]
Homepage = "https://github.com/crieck2010/survey-viz"
Repository = "https://github.com/crieck2010/survey-viz"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
viz = ["data/regions.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
